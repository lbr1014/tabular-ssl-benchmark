name: CI

on:
  push:
    branches:
      - main
      - develop
      - chore/ci-quality
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run static analysis
        run: python -m ruff check .

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Check development CLI
        run: tabular-ssl-benchmark --help

      - name: Build source and wheel distributions
        run: python -m build --outdir "$RUNNER_TEMP/distributions"

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/distributions/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check

      - name: Check installed CLI outside repository
        working-directory: ${{ runner.temp }}
        run: |
          env -u PYTHONPATH \
            "$RUNNER_TEMP/wheel-venv/bin/tabular-ssl-benchmark" --help