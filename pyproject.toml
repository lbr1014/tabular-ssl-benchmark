[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "tabular-ssl-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for semi-supervised learning on tabular data"
requires-python = ">=3.10"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]